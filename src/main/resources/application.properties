spring.application.name=stayhub-Country
server.port=8082
grpc.server.port=9092

springdoc.api-docs.path=/api-docs-Country
springdoc.swagger-ui.path=/swagger-ui.html

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

logging.level.org.springframework=INFO
logging.level.com.Angelh0.stayhook=DEBUG

spring.datasource.url=jdbc:postgresql://localhost:5432/stayhub_country
spring.datasource.username=${pg_user}
spring.datasource.password=${pg_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
